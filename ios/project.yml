name: Euler
options:
  bundleIdPrefix: net.spaceheater
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 66LT3G6V44
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  EulerAPI:
    path: EulerAPI
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    exactVersion: 1.1.0
targets:
  Euler:
    type: application
    platform: iOS
    sources:
      - path: Euler
      # The web's bundled fonts, registered at launch; one copy serves both clients.
      - path: ../public/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: EulerAPI
      - package: Markdown
      - package: SwiftMath
      - package: HighlightSwift
      - target: EulerNotificationService
    entitlements:
      path: Euler/Euler.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.net.spaceheater.euler
    info:
      path: Euler/Info.plist
      properties:
        CFBundleDisplayName: Euler
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The server is whatever address the user enters, often plain HTTP on the tailnet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Take a photo to attach to a message.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.spaceheater.euler
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  EulerNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: EulerNotificationService
    entitlements:
      path: EulerNotificationService/EulerNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.spaceheater.euler
    info:
      path: EulerNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Euler Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.spaceheater.euler.notifications
  EulerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EulerTests
    dependencies:
      - target: Euler
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
  EulerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EulerUITests
    dependencies:
      - target: Euler
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Euler:
    build:
      targets:
        Euler: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EulerTests
        - EulerUITests
