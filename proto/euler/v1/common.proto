syntax = "proto3";

package euler.v1;

// Display metadata shared by integrations and recorded tool calls.
message DisplayIcon {
  enum Theme {
    THEME_UNSPECIFIED = 0;
    THEME_LIGHT = 1;
    THEME_DARK = 2;
  }
  // An https URL or a base64 PNG, JPEG or WebP data URL.
  string src = 1;
  Theme theme = 2;
}

// The recurring failures with public messages. Names match ERROR_MESSAGES in
// src/schemas/observability.ts.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL_ERROR = 1;
  ERROR_CODE_INVALID_REQUEST = 2;
  ERROR_CODE_UNSUPPORTED_MEDIA_TYPE = 3;
  ERROR_CODE_BODY_TOO_LARGE = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_FORBIDDEN = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_ENVIRONMENT_MANAGED = 8;
  ERROR_CODE_CATALOG_UNAVAILABLE = 9;
  ERROR_CODE_COMFY_UNREACHABLE = 10;
  ERROR_CODE_COMFY_ASSET_UNAVAILABLE = 11;
  ERROR_CODE_JOB_FAILED = 12;
  ERROR_CODE_JOB_OUTPUT_INVALID = 13;
  ERROR_CODE_JOB_INTERRUPTED = 14;
}

// The public diagnostic for a failure. Rides on Connect errors as a detail and
// on failed jobs.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  optional string request_id = 3;
  optional string job_id = 4;
}

// Structured output a tool shows in the trace: its input, progress and result.
message ToolContent {
  repeated ToolBlock blocks = 1;
}

message ToolBlock {
  message Text {
    string text = 1;
    optional string label = 2;
  }
  message Code {
    string text = 1;
    optional string language = 2;
    optional string label = 3;
  }
  message Field {
    string label = 1;
    string value = 2;
  }
  message Fields {
    repeated Field fields = 1;
  }
  oneof kind {
    Text text = 1;
    Code code = 2;
    Fields fields = 3;
  }
}
