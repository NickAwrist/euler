syntax = "proto3";

package euler.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Token and spend totals across the user's model calls.
service UsageService {
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Counts are SQL sums, exact as doubles; a uint64 would be a bigint in TypeScript.
message UsageTotals {
  double calls = 1;
  double tokens = 2;
  // Absent when a provider did not report it.
  optional double input = 3;
  optional double output = 4;
  optional double cached = 5;
  optional double uncached = 6;
  optional double cost = 7;
  optional double savings = 8;
  optional double cache_hit_rate = 9;
}

message UsageSortRule {
  enum Column {
    COLUMN_UNSPECIFIED = 0;
    COLUMN_NAME = 1;
    COLUMN_TOKENS = 2;
    COLUMN_SHARE = 3;
    COLUMN_SPEND = 4;
    COLUMN_CACHED = 5;
    COLUMN_SAVINGS = 6;
  }
  Column column = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool descending = 2;
}

enum UsageGrouping {
  USAGE_GROUPING_UNSPECIFIED = 0;
  USAGE_GROUPING_MODEL = 1;
  USAGE_GROUPING_HOUR = 2;
}

message GetUsageRequest {
  // 0 for all time, or 1, 7, 30 or 90.
  uint32 days = 1 [(buf.validate.field).uint32 = {
    in: [
      0,
      1,
      7,
      30,
      90
    ]
  }];
  UsageGrouping grouping = 2 [(buf.validate.field).enum.defined_only = true];
  // Limits totals and rows to these providers; empty for all.
  repeated string providers = 3 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  uint32 page = 4 [(buf.validate.field).uint32.lte = 100000];
  // Pins the window's end so pages stay consistent; absent for now.
  optional google.protobuf.Timestamp as_of = 5;
  // Defaults to spend, descending.
  repeated UsageSortRule sorting = 6 [(buf.validate.field).repeated.max_items = 6];
}

message GetUsageResponse {
  message ProviderTotals {
    string key = 1;
    uint32 model_count = 2;
    UsageTotals totals = 3;
  }
  message Series {
    string model = 1;
    repeated double tokens = 2;
    repeated double spend = 3;
  }
  message Chart {
    double interval_ms = 1;
    repeated google.protobuf.Timestamp buckets = 2;
    repeated Series series = 3;
  }
  message Row {
    // The model, or the hour's start in milliseconds.
    string key = 1;
    optional google.protobuf.Timestamp hour = 2;
    // Percent of all tokens in the window.
    double token_share = 3;
    UsageTotals totals = 4;
  }
  message Breakdown {
    repeated Row rows = 1;
    uint32 page = 2;
    uint32 page_size = 3;
    uint32 total_rows = 4;
  }
  UsageGrouping grouping = 1;
  google.protobuf.Timestamp as_of = 2;
  UsageTotals totals = 3;
  repeated ProviderTotals providers = 4;
  Chart chart = 5;
  Breakdown breakdown = 6;
}
