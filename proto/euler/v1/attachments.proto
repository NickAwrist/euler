syntax = "proto3";

package euler.v1;

import "buf/validate/validate.proto";

// Images a user attaches to a message, and the outputs tools attach to replies.
service AttachmentService {
  // Stores an image for a chat. Images are at most 8 MiB.
  rpc CreateAttachment(CreateAttachmentRequest) returns (CreateAttachmentResponse);
  rpc GetAttachmentData(GetAttachmentDataRequest) returns (GetAttachmentDataResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse);
}

message ImageAttachment {
  string id = 1;
  string name = 2;
  // image/png, image/jpeg, image/webp or image/gif.
  string mime_type = 3;
  uint32 size = 4;
}

// A file a tool wrote in the chat's workspace.
message WorkspaceFileAttachment {
  enum WorkspaceKind {
    WORKSPACE_KIND_UNSPECIFIED = 0;
    WORKSPACE_KIND_SANDBOX = 1;
    WORKSPACE_KIND_LOCAL = 2;
  }
  string id = 1;
  string name = 2;
  uint64 size = 3;
  string path = 4;
  string session_id = 5;
  WorkspaceKind workspace_kind = 6;
}

// An image ComfyUI generated, served under /api/comfyui/view/.
message GeneratedImageAttachment {
  string url = 1;
}

// A web page a search or fetch tool cited.
message WebSourceAttachment {
  string title = 1;
  string url = 2;
}

message MessageAttachment {
  oneof kind {
    ImageAttachment image = 1;
    WorkspaceFileAttachment file = 2;
    GeneratedImageAttachment generated_image = 3;
    WebSourceAttachment web_source = 4;
  }
}

// Output a tool or agent attaches, independent of reply text.
message OutputAttachment {
  oneof kind {
    WorkspaceFileAttachment file = 1;
    GeneratedImageAttachment generated_image = 2;
    WebSourceAttachment web_source = 3;
  }
}

message CreateAttachmentRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  string filename = 2 [(buf.validate.field).string.max_len = 1024];
  string mime_type = 3 [(buf.validate.field).string = {
    in: [
      "image/png",
      "image/jpeg",
      "image/webp",
      "image/gif"
    ]
  }];
  bytes data = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 8388608
  }];
}

message CreateAttachmentResponse {
  ImageAttachment attachment = 1;
}

message GetAttachmentDataRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetAttachmentDataResponse {
  string mime_type = 1;
  bytes data = 2;
}

message DeleteAttachmentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteAttachmentResponse {}
