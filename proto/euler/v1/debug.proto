syntax = "proto3";

package euler.v1;

import "buf/validate/validate.proto";
import "euler/v1/agent.proto";

// What the model would see, for the debug view.
service DebugService {
  // The system prompt the next turn would use.
  rpc PreviewPrompt(PreviewPromptRequest) returns (PreviewPromptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message PreviewPromptRequest {
  // The chat whose workspace the prompt describes; absent for a new chat.
  optional string session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional RunMetadata metadata = 2;
  // A draft message, for skills it would invoke.
  optional string message = 3;
}

message PreviewPromptResponse {
  string system_prompt = 1;
}
