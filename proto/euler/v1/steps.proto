syntax = "proto3";

package euler.v1;

import "euler/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// One step of an agent's trace: a model call, a tool call, or how a turn ended.
// Mirrors Step in src/RunContext.ts.
message Step {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_LLM_CALL = 1;
    KIND_TOOL_CALL = 2;
    KIND_COMPLETE = 3;
    KIND_ERROR = 4;
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RUNNING = 1;
    STATUS_DONE = 2;
    STATUS_ERROR = 3;
  }
  Kind kind = 1;
  Status status = 2;
  int32 turn_index = 3;
  optional string tool_name = 4;
  repeated DisplayIcon tool_icons = 5;
  optional string job_id = 6;
  // The tool call's arguments, as the model sent them.
  optional google.protobuf.Struct args = 7;
  optional string result = 8;
  optional string thinking = 9;
  optional LlmMetrics metrics = 10;
  optional string error = 11;
  google.protobuf.Timestamp started_at = 12;
  optional google.protobuf.Timestamp ended_at = 13;
  // The agent that ran the step.
  optional string agent_name = 14;
}

message LlmMetrics {
  optional double cost = 1;
  optional uint32 cached_tokens = 2;
  optional uint32 output_tokens = 3;
  optional double output_duration_ms = 4;
  optional uint32 prompt_tokens = 5;
  optional double prompt_duration_ms = 6;
  optional double total_duration_ms = 7;
  optional double load_duration_ms = 8;
  optional double tokens_per_second = 9;
  // Time from the model request to its last reasoning token.
  optional double thinking_duration_ms = 10;
  // Billed cost split by token class.
  optional CostBreakdown cost_breakdown = 11;
  // What the cached input would have cost at the uncached input price.
  optional double cache_savings = 12;
}

message CostBreakdown {
  double cached_input = 1;
  double uncached_input = 2;
  double output = 3;
}
